project:
    type: website
    resources:
        - site/notebooks/
    output-dir: _site
    render:
        - site/index.qmd

website:
    title: "TODO"
    repo-url: https://github.com/MadeInShineA/aml-project/
    repo-actions: [edit]
    navbar:
        left:
            - href: site/index.qmd
              text: Home
            - text: Notebooks
              menu:
                  - href: site/notebooks/preprocessing.html
                    text: Preprocessing
        tools:
            - icon: github
              href: https://github.com/MadeInShineA/aml-project
              target: _blank
              text: AML Project GitHub

    page-footer:
        left: |
            Made with [Quarto](https://quarto.org/){target="_blank"}
        center:
            - text: "TODO | © 2026"
        right:
            - icon: github
              href: https://github.com/MadeInShineA/aml-project
              target: _blank
              aria-label: AML Project GitHub

format:
    html:
        respect-user-color-scheme: true
        toc: true
        toc-title: "Table of Content"
        toc-depth: 4
        theme:
            light: [cosmo, site/assets/style/theme.scss]
            dark: [cosmo, site/assets/style/dark_theme.scss]
        code-copy: true
        code-overflow: wrap
